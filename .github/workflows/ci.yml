name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Real WebRTC peers, run on their own after the parallel suite has
      # finished. These stall under machine load rather than failing: 0/40
      # idle, 6/40 immediately after a heavy run, every stall the full 15s
      # timeout. `turbo run test --concurrency=4` is exactly that loaded
      # condition, so they are kept out of it and serialised against each
      # other too (two of them running together failed 2 runs in 3).
      #
      # The stalls are an upstream DTLS race, fixed in libdatachannel v0.24.5
      # but not yet in node-datachannel, which still pins v0.24.3. Every test
      # here now retries the handshake once, which covers it. Keep the
      # serialisation regardless -- it predates that bug and is about load,
      # not about #26. See #26 for the root cause and the revert condition.
      - name: Run real-peer WebRTC tests (serialized)
        # Fail rather than skip if the native binding is missing -- a skipped
        # suite reports success, which would make this step decorative.
        env:
          REQUIRE_REAL_PEER: '1'
        run: npm run test:real-peer

      # Real WebGPU compute (browsermesh-apps' gpu-kernel.mjs), against
      # Dawn's software (Vulkan/lavapipe) renderer -- there is no physical
      # GPU on this runner. Verified during development (browsermesh#63):
      # on a bare ubuntu-latest-equivalent image, requestAdapter() returns
      # null (no Vulkan ICD present at all); installing libvulkan1 +
      # mesa-vulkan-drivers (llvmpipe/lavapipe) makes a real adapter/device
      # available and the shader computes correct results, cross-checked
      # against the CPU aggregate() path. Without these two packages this
      # step would silently produce a device-less skip on every run.
      - name: Install software Vulkan driver for headless WebGPU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers

      - name: Run real-WebGPU compute tests
        # Fail rather than skip if the native binding is missing or no
        # adapter/device is obtainable -- a skipped suite reports success,
        # which would make this step decorative.
        env:
          REQUIRE_WEBGPU: '1'
        run: npm run test:real-gpu
