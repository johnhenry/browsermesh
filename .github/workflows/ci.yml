name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Real WebRTC peers, run on their own after the parallel suite has
      # finished. These stall under machine load rather than failing: 0/40
      # idle, 6/40 immediately after a heavy run, every stall the full 15s
      # timeout. `turbo run test --concurrency=4` is exactly that loaded
      # condition, so they are kept out of it and serialised against each
      # other too (two of them running together failed 2 runs in 3).
      #
      # The stalls are an upstream DTLS race, fixed in libdatachannel v0.24.5
      # but not yet in node-datachannel, which still pins v0.24.3. Every test
      # here now retries the handshake once, which covers it. Keep the
      # serialisation regardless -- it predates that bug and is about load,
      # not about #26. See #26 for the root cause and the revert condition.
      - name: Run real-peer WebRTC tests (serialized)
        # Fail rather than skip if the native binding is missing -- a skipped
        # suite reports success, which would make this step decorative.
        env:
          REQUIRE_REAL_PEER: '1'
        run: npm run test:real-peer

      # Real WebGPU compute (browsermesh-apps' gpu-kernel.mjs) is
      # deliberately NOT wired into this CI job. It was investigated
      # (browsermesh#63): a software Vulkan renderer (llvmpipe, via
      # `apt-get install libvulkan1 mesa-vulkan-drivers`) does let Dawn's
      # `webgpu` binding obtain a real adapter/device headlessly -- adapter
      # acquisition, device acquisition, and the shader's actual compute
      # results (cross-checked against the CPU aggregate() path) all
      # verified working, on both a local emulated approximation of this
      # runner and briefly on this repo's real GitHub-hosted ubuntu-latest
      # runner itself. But that same real-runner run also hit a native
      # crash inside the binding itself, deterministically:
      #   Fatal glibc error: pthread_mutex_lock.c:94 (___pthread_mutex_lock):
      #   assertion failed: mutex->__data.__owner == 0
      # right as `GPUBuffer.mapAsync()`'s cross-thread completion callback
      # fires -- a threading bug in dawn.node's own native code, not in
      # this package's WGSL/JS, and not reproducible in a slower/emulated
      # local approximation (real hardware timing exposes races that
      # emulation hides). There is no JS-level mitigation for a native
      # crash like this, so `npm run test:real-gpu` stays a local/manual-
      # only tier (see packages/browsermesh-apps/README.md) rather than a
      # CI step that would fail unpredictably on every run.
