name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The isolate lane's runtime (isolated-vm, an optional native addon) on
      # Linux x64 with its prebuilt binary. `npm test` above already runs this
      # file, but it SKIPS it when the addon does not load, and a skipped suite
      # reports success. REQUIRE_ISOLATED_VM=1 makes a missing addon a failure,
      # so a dependency or Node bump that loses the binary is seen here.
      - name: Run the isolate runtime tests (must not skip)
        env:
          REQUIRE_ISOLATED_VM: '1'
        run: node --test packages/browsermesh-pod/test/isolate-runtime.test.mjs

      # Real WebRTC peers, run on their own after the parallel suite has
      # finished. These stall under machine load rather than failing: 0/40
      # idle, 6/40 immediately after a heavy run, every stall the full 15s
      # timeout. `turbo run test --concurrency=4` is exactly that loaded
      # condition, so they are kept out of it and serialised against each
      # other too (two of them running together failed 2 runs in 3).
      #
      # The stalls are an upstream DTLS race, fixed in libdatachannel v0.24.5
      # but not yet in node-datachannel, which still pins v0.24.3. Every test
      # here now retries the handshake once, which covers it. Keep the
      # serialisation regardless -- it predates that bug and is about load,
      # not about #26. See #26 for the root cause and the revert condition.
      - name: Run real-peer WebRTC tests (serialized)
        # The step takes about four minutes. Past this it is stuck: it is stopped
        # (and fails) rather than held until the runner gives up on the whole job.
        # Each package's script also passes `--test-force-exit`, so a test file whose
        # tests are all done cannot keep its process alive on a handle a failed
        # test left open.
        timeout-minutes: 15
        # Fail rather than skip if the native binding is missing -- a skipped
        # suite reports success, which would make this step decorative.
        env:
          REQUIRE_REAL_PEER: '1'
        run: npm run test:real-peer

      # Real WebGPU compute (browsermesh-apps' gpu-kernel.mjs) is
      # deliberately NOT wired into this CI job. It was investigated
      # (browsermesh#63): a software Vulkan renderer (llvmpipe, via
      # `apt-get install libvulkan1 mesa-vulkan-drivers`) does let Dawn's
      # `webgpu` binding obtain a real adapter/device headlessly -- adapter
      # acquisition, device acquisition, and the shader's actual compute
      # results (cross-checked against the CPU aggregate() path) all
      # verified working, on both a local emulated approximation of this
      # runner and briefly on this repo's real GitHub-hosted ubuntu-latest
      # runner itself. But that same real-runner run also hit a native
      # crash inside the binding itself, deterministically:
      #   Fatal glibc error: pthread_mutex_lock.c:94 (___pthread_mutex_lock):
      #   assertion failed: mutex->__data.__owner == 0
      # right as `GPUBuffer.mapAsync()`'s cross-thread completion callback
      # fires -- a threading bug in dawn.node's own native code, not in
      # this package's WGSL/JS, and not reproducible in a slower/emulated
      # local approximation (real hardware timing exposes races that
      # emulation hides). There is no JS-level mitigation for a native
      # crash like this, so `npm run test:real-gpu` stays a local/manual-
      # only tier (see packages/browsermesh-apps/README.md) rather than a
      # CI step that would fail unpredictably on every run.

  # The mesh in real browsers (issue #270): two browser contexts, a real
  # RTCPeerConnection over loopback, a real WebSocket relay, all under a strict
  # Content-Security-Policy. See tests/browser/README.md.
  #
  # Only workflow-lint is a required check (see the branch ruleset), so the
  # Firefox and WebKit legs are allowed to fail: they report, they do not gate.
  # Chromium is the gating leg in practice.
  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install the browser and its system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser tests
        env:
          BM_BROWSERS: ${{ matrix.browser }}
        run: npm run test:browser

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            tests/browser/test-results/
            tests/browser/playwright-report/
          retention-days: 7

  # The microVM lane's host side on a real Linux kernel, without KVM (nothing here
  # boots a VM; docs/runbook-firecracker-kvm.md is the part that needs one): the
  # spike's own suite, and the network policy applied for real (nft rules and a
  # TAP device, with a guest network namespace behind them). The second step
  # needs root and changes host networking, which is fine on a throwaway runner;
  # REQUIRE_REAL_LINUX_NET makes a missing prerequisite fail instead of skip.
  microvm-lane:
    name: microVM lane (Linux, no KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Spike tests
        run: node --test spikes/vm-pod-host/test/*.test.mjs

      - name: Install nftables and iproute2
        run: sudo apt-get install -y --no-install-recommends nftables iproute2

      # The runner has Docker, which sets the iptables FORWARD policy to DROP;
      # the test's control run (no rules of ours: the guest must be able to reach
      # the "internet") needs forwarding to work, then checks the rules close it.
      - name: Let the runner forward packets
        run: sudo iptables -P FORWARD ACCEPT

      - name: Network policy on a real kernel
        env:
          REQUIRE_REAL_LINUX_NET: '1'
        run: sudo env "PATH=$PATH" REQUIRE_REAL_LINUX_NET="$REQUIRE_REAL_LINUX_NET" npm run test:real-linux-network

  workflow-lint:
    name: Workflow Lint
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
