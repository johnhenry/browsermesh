# wrangler.toml — isolate-pod-host spike (issue #185 WP2)
#
# Not a published package. Lives outside the npm workspaces
# (`spikes/isolate-pod-host/`, root workspaces is `packages/*` only) so it
# can depend on wrangler and the Workers runtime types without pulling them
# into the rest of the monorepo.

name = "browsermesh-isolate-pod-host-spike"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# One Durable Object instance per hosted pod (idFromName(podName)).
[[durable_objects.bindings]]
name = "POD"
class_name = "PodObject"

# new_sqlite_classes: PodObject is a fresh class with no prior migration
# history, and SQLite-backed storage is what ctx.storage.setAlarm() /
# ctx.storage.get/put use under the hood for new Durable Object classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PodObject"]

[vars]
RELAY_URL = "ws://localhost:8788"
SIGNALING_URL = "ws://localhost:8787"
DISCOVERY_CHANNEL = "pod-discovery"
